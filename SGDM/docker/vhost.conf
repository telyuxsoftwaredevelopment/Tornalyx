<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        # -Indexes evita listar directorios; AllowOverride All habilita el
        # .htaccess de public/ (reescritura al front controller y cabeceras).
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs a stdout/stderr para que Render los capture.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
